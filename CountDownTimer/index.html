<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>

<h2 id="head">Countdown To</h2>
<body>
    <div class="CountDownTimer">
        <div class="Head">
            <h1 id="year">New Year</h1>
        </div>

        <div class="Continer">
            <div class="Timer">
                <h2 id="days">00</h2>
                <small>Days</small>
            </div>

            <div class="Timer">
                <h2 id="hours">00</h2>
                <small>Hours</small>
            </div>

            <div class="Timer">
                <h2 id="minutes">00</h2>
                <small>Minutes</small>
            </div>

            <div class="Timer">
                <h2 id="seconds">00</h2>
                <small>Seconds</small>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
